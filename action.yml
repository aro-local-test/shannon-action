name: "Shannon AI Pentest"
description: "AI penetration testing in CI — scan a running target, report exploitable vulnerabilities, and gate the build on severity."
author: "Keygraph"

branding:
  icon: "shield"
  color: "purple"

inputs:
  api-key:
    description: "AI provider API key. Store it as an encrypted secret and pass it here; exported as SHANNON_AI_API_KEY (provider-neutral)."
    required: true
  model:
    description: "Model as '<provider>:<model-id>' (e.g. anthropic:claude-sonnet-4-6). Exported as SHANNON_AI_MODEL. Empty uses Shannon's default."
    required: false
    default: ""
  target-url:
    description: "URL of the running target to scan (e.g. your staging or preview deployment for this commit)."
    required: true
  config-path:
    description: "Path to a committed Shannon config (YAML), passed with -c. If it does not exist, the scan runs at MAX scope."
    required: false
    default: ".shannon/ci.yml"
  fail-on:
    description: "Fail the job when any finding is at or above this severity: none | info | low | medium | high | critical."
    required: false
    default: "none"
  pipeline-testing:
    description: "Run a fast smoke test with minimal prompts (no real analysis). For validating pipeline wiring only."
    required: false
    default: "false"
  upload-sarif:
    description: "Upload Shannon's SARIF (report.sarif) to GitHub code scanning. Requires 'security-events: write' and report.sarif enabled in your Shannon config."
    required: false
    default: "true"
  comment-pr:
    description: "Post or update a findings-summary comment on the pull request. Requires 'pull-requests: write' and a pull_request event."
    required: false
    default: "false"
  shannon-version:
    description: "Version or npm dist-tag of @keygraph/shannon to run."
    required: false
    default: "latest"

outputs:
  result:
    description: "Scan outcome: completed | failed."
    value: ${{ steps.analyze.outputs.result }}
  findings-count:
    description: "Total number of findings."
    value: ${{ steps.analyze.outputs.findings-count }}
  blocking-count:
    description: "Number of findings at or above fail-on."
    value: ${{ steps.analyze.outputs.blocking-count }}
  highest-severity:
    description: "Highest severity found (none if clean)."
    value: ${{ steps.analyze.outputs.highest-severity }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Run Shannon scan
      shell: bash
      env:
        SHANNON_AI_API_KEY: ${{ inputs.api-key }}
        SHANNON_AI_MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        FLAGS=(-f)   # --follow: block until the scan finishes; exit non-zero if the scan fails
        [ "${{ inputs.pipeline-testing }}" = "true" ] && FLAGS+=(--pipeline-testing)
        CONFIG="${{ inputs.config-path }}"
        if [ -n "$CONFIG" ]; then
          case "$CONFIG" in /*) : ;; *) CONFIG="$GITHUB_WORKSPACE/$CONFIG" ;; esac
          if [ -f "$CONFIG" ]; then FLAGS+=(-c "$CONFIG"); echo "Using config: $CONFIG"
          else echo "::warning::No Shannon config at $CONFIG — running at MAX scope."; fi
        fi
        npx --yes "@keygraph/shannon@${{ inputs.shannon-version }}" start \
          -u "${{ inputs.target-url }}" \
          -r "$GITHUB_WORKSPACE" \
          -w "$GITHUB_RUN_ID" \
          "${FLAGS[@]}"

    - name: Analyze results
      id: analyze
      if: always()
      shell: bash
      run: node "${{ github.action_path }}/scripts/postprocess.mjs" "$HOME/.shannon/workspaces/$GITHUB_RUN_ID" "${{ inputs.fail-on }}"

    - name: Locate Shannon SARIF
      id: sarif
      if: always()
      shell: bash
      run: |
        # `find … -print -quit` returns the first match WITHOUT a pipe. Two footguns this avoids,
        # both under GitHub's default composite bash (`-eo pipefail`):
        #   1. `find … | head -1` makes find SIGPIPE (141) when head closes the pipe → step fails.
        #   2. a trailing `[ -z "$FILE" ] && echo …` exits 1 when the file IS found (the success
        #      case), because the test is false → that non-zero becomes the step's exit code.
        FILE=$(find "$HOME/.shannon/workspaces/$GITHUB_RUN_ID" -name report.sarif -print -quit 2>/dev/null || true)
        echo "file=$FILE" >> "$GITHUB_OUTPUT"
        if [ -z "$FILE" ]; then
          echo "::warning::No report.sarif found. Enable 'report.sarif: \"true\"' in your Shannon config (exploit runs only) to publish to code scanning."
        fi

    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.sarif.outputs.file != '' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.sarif.outputs.file }}

    - name: Comment on the pull request
      if: ${{ always() && inputs.comment-pr == 'true' && github.event_name == 'pull_request' }}
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        COMMENT: ${{ steps.analyze.outputs.comment }}
      with:
        script: |
          const body = process.env.COMMENT;
          if (!body) return;
          const marker = '<!-- shannon-action -->';
          const { data: comments } = await github.rest.issues.listComments({
            ...context.repo, issue_number: context.issue.number, per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
          else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: shannon-report
        path: ~/.shannon/workspaces/${{ github.run_id }}
        include-hidden-files: true
        if-no-files-found: warn

    - name: Enforce severity gate
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        BLOCKING="${{ steps.analyze.outputs.blocking-count }}"
        if [ "${{ inputs.fail-on }}" != "none" ] && [ "${BLOCKING:-0}" -gt 0 ]; then
          echo "::error::${BLOCKING} finding(s) at or above severity '${{ inputs.fail-on }}'."
          exit 1
        fi
        echo "Severity gate passed (blocking=${BLOCKING:-0})."
